<!-- navbar.html -->
<nav th:fragment="navbar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-calendar-check me-1"></i> Attendance System
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>

                <!-- Logged in navigation -->
                <li sec:authorize="hasRole('ROLE_ADMIN')" class="nav-item">
                    <a class="nav-link fw-semibold text-warning" th:href="@{/admin/dashboard}">Admin Dashboard</a>
                </li>
                <li sec:authorize="hasRole('ROLE_TEACHER')" class="nav-item">
                    <a class="nav-link fw-semibold text-info" th:href="@{/teacher/dashboard}">Teacher Dashboard</a>
                </li>
                <li sec:authorize="hasRole('ROLE_STUDENT')" class="nav-item">
                    <a class="nav-link fw-semibold text-light" th:href="@{/student/dashboard}">Student Dashboard</a>
                </li>

                <!-- Anonymous navigation -->
                <li sec:authorize="!isAuthenticated()" class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
                <li sec:authorize="!isAuthenticated()" class="nav-item"><a class="nav-link" th:href="@{/register}">Register</a></li>

                <!-- Logout -->
                <li sec:authorize="isAuthenticated()" class="nav-item ms-lg-2">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm px-3">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

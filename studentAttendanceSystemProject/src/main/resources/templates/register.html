<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Registration - Smart Attendance System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; padding-top: 80px; padding-bottom: 40px;">
    <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%; border-radius: 12px; border: none;">
        <div class="text-center mb-3">
            <h3 class="fw-bold text-primary">Student Registration</h3>
            <p class="text-muted small">नोंदणीकृत मोबाइल क्रमांकासह विद्यार्थी नोंदणी (Register with pre-verified details)</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Full Name (नाव) *</label>
                <input type="text" name="name" placeholder="Enter Full Name" required class="form-control">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Roll Number (रोल नंबर) *</label>
                    <input type="text" name="rollNumber" placeholder="e.g. ROLL101 or 101" required class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Division (तुकडी)</label>
                    <input type="text" name="division" placeholder="e.g. A, B, C" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address (ईमेल) *</label>
                <input type="email" name="email" placeholder="student@example.com" required class="form-control">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Student Mobile (विद्यार्थी मोबाईल) *</label>
                    <input type="tel" name="mobileNumber" placeholder="10-digit Mobile" required pattern="[0-9]{10}" class="form-control">
                    <div class="form-text small">Used for OTP & QR verification</div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Parent Mobile (पालक मोबाईल) *</label>
                    <input type="tel" name="parentMobileNumber" placeholder="10-digit Mobile" required pattern="[0-9]{10}" class="form-control">
                    <div class="form-text small">Used for Marathi attendance SMS</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">Password (पासवर्ड) *</label>
                <input type="password" name="password" placeholder="Create Password" required class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background-color: #1E3A8A; border-color: #1E3A8A;">
                Register Account
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Already registered? </span>
            <a th:href="@{/login}" class="text-primary fw-semibold small">Login here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

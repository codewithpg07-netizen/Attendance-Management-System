<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Students - Admin</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .students-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 28px;
            margin-top: 30px;
            margin-bottom: 40px;
        }
        .stat-badge {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 10px 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
        }
        .stat-badge strong {
            font-size: 1.25rem;
            color: #1e3a8a;
        }
        .search-box {
            position: relative;
            min-width: 280px;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .search-box input {
            padding-left: 36px;
            border-radius: 8px;
        }
        .table-responsive {
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .table thead th {
            background: #1e3a8a;
            color: #fff;
            font-weight: 600;
            vertical-align: middle;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .table tbody tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body style="background: #f8fafc;">

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container students-card">

    <!-- Header & Summary Stats -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom gap-3">
        <div>
            <h2 class="fw-bold mb-1" style="color: #1E3A8A;">Student Database (TY A Dataset)</h2>
            <p class="text-muted mb-0">Active student directory imported from verified college records</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <div class="stat-badge">
                <i class="bi bi-people-fill text-primary fs-5"></i>
                <div>
                    <span class="text-muted d-block small">Total Students</span>
                    <strong id="totalCount" th:text="${students != null ? students.size() : 0}">0</strong>
                </div>
            </div>
            <div class="stat-badge">
                <i class="bi bi-mortarboard-fill text-success fs-5"></i>
                <div>
                    <span class="text-muted d-block small">Batch</span>
                    <strong>TY - Div A</strong>
                </div>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-primary d-flex align-items-center gap-1 shadow-sm" style="background-color: #1E3A8A;">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>

    <!-- Filter & Live Search Toolbar -->
    <div class="card p-3 mb-4 bg-light border-0 shadow-sm" style="border-radius: 10px;">
        <div class="row g-2 align-items-center">
            <!-- Live Instant Search -->
            <div class="col-md-5">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="studentSearchInput" class="form-control" placeholder="Search by Roll No, Name, Mobile, Email..." onkeyup="filterStudentTable()">
                </div>
            </div>

            <!-- Server-Side Filter Form -->
            <div class="col-md-7">
                <form th:action="@{/admin/view-students}" method="get" class="d-flex flex-wrap gap-2 justify-content-md-end">
                    <select name="departmentId" class="form-select form-select-sm w-auto">
                        <option value="">All Departments</option>
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${param.departmentId != null and param.departmentId[0] == ('' + d.id)}"></option>
                    </select>

                    <select name="year" class="form-select form-select-sm w-auto">
                        <option value="">All Years</option>
                        <option value="1" th:selected="${param.year != null and param.year[0] == '1'}">1st Year</option>
                        <option value="2" th:selected="${param.year != null and param.year[0] == '2'}">2nd Year</option>
                        <option value="3" th:selected="${param.year != null and param.year[0] == '3'}">3rd Year (TY)</option>
                        <option value="4" th:selected="${param.year != null and param.year[0] == '4'}">4th Year</option>
                    </select>

                    <button type="submit" class="btn btn-outline-primary btn-sm">Filter</button>
                    <a th:href="@{/admin/view-students}" class="btn btn-outline-secondary btn-sm">Reset</a>
                </form>
            </div>
        </div>
    </div>

    <!-- Result Count Indicator -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small">
            Showing <span id="visibleCount" class="fw-bold text-dark" th:text="${students != null ? students.size() : 0}"></span> students
        </span>
        <button class="btn btn-outline-success btn-sm" onclick="exportTableToCSV('students_dataset.csv')">
            <i class="bi bi-file-earmark-excel me-1"></i> Export CSV
        </button>
    </div>

    <!-- Students Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover mb-0" id="studentTable">
            <thead>
                <tr>
                    <th style="width: 85px;">Roll No</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th style="width: 70px;">Year</th>
                    <th style="width: 60px;">Div</th>
                    <th>Student Mobile</th>
                    <th>Parent Mobile</th>
                    <th style="width: 95px;">Registered</th>
                    <th style="width: 120px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${students}">
                    <td><strong class="text-primary" th:text="${s.rollNumber}"></strong></td>
                    <td class="fw-semibold" th:text="${s.name}"></td>
                    <td><code class="small text-muted" th:text="${s.email}"></code></td>
                    <td th:text="${s.department != null ? s.department.name : 'Computer Science and Engineering'}"></td>
                    <td><span class="badge bg-secondary" th:text="${s.year == '3' ? '3rd (TY)' : s.year}"></span></td>
                    <td><span class="badge bg-light text-dark border" th:text="${s.division != null ? s.division : (s.section != null ? s.section : 'A')}"></span></td>
                    <td>
                        <a th:if="${s.mobileNumber != null and !s.mobileNumber.isEmpty()}" th:href="'tel:' + ${s.mobileNumber}" class="text-decoration-none" th:text="${s.mobileNumber}"></a>
                        <span th:unless="${s.mobileNumber != null and !s.mobileNumber.isEmpty()}" class="text-muted">-</span>
                    </td>
                    <td>
                        <a th:if="${s.parentMobileNumber != null and !s.parentMobileNumber.isEmpty()}" th:href="'tel:' + ${s.parentMobileNumber}" class="text-decoration-none text-secondary" th:text="${s.parentMobileNumber}"></a>
                        <span th:unless="${s.parentMobileNumber != null and !s.parentMobileNumber.isEmpty()}" class="text-muted">-</span>
                    </td>
                    <td>
                        <span th:if="${s.registered}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Yes</span>
                        <span th:unless="${s.registered}" class="badge bg-secondary">No</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/edit-student/{id}(id=${s.id})}" class="btn btn-warning btn-sm py-0 px-2" title="Edit">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <a th:href="@{/admin/delete-student/{id}(id=${s.id})}" class="btn btn-danger btn-sm py-0 px-2" onclick="return confirm('Are you sure you want to delete this student record?')" title="Delete">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${students == null or students.isEmpty()}">
                    <td colspan="10" class="text-center py-4 text-muted">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        No student records found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Client-side Search and CSV Export JavaScript -->
<script>
function filterStudentTable() {
    const input = document.getElementById("studentSearchInput");
    const filter = input.value.toLowerCase().trim();
    const table = document.getElementById("studentTable");
    const tr = table.getElementsByTagName("tbody")[0].getElementsByTagName("tr");
    let visible = 0;

    for (let i = 0; i < tr.length; i++) {
        // Skip empty row placeholder if any
        if (tr[i].cells.length <= 1) continue;
        const text = tr[i].innerText.toLowerCase();
        if (text.indexOf(filter) > -1) {
            tr[i].style.display = "";
            visible++;
        } else {
            tr[i].style.display = "none";
        }
    }
    const countEl = document.getElementById("visibleCount");
    if (countEl) countEl.innerText = visible;
}

function exportTableToCSV(filename) {
    const csv = [];
    const rows = document.querySelectorAll("#studentTable tr");
    for (let i = 0; i < rows.length; i++) {
        // Skip hidden rows
        if (rows[i].style.display === "none") continue;
        const row = [];
        const cols = rows[i].querySelectorAll("td, th");
        // Exclude action column (last column)
        for (let j = 0; j < cols.length - 1; j++) {
            let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").trim();
            data = data.replace(/"/g, '""');
            row.push('"' + data + '"');
        }
        csv.push(row.join(","));
    }
    const csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
    const downloadLink = document.createElement("a");
    downloadLink.download = filename;
    downloadLink.href = window.URL.createObjectURL(csvFile);
    downloadLink.style.display = "none";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Teachers - Admin</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container table-container">

    <h2 class="mb-4 text-center">All Teachers</h2>

    <table class="table table-bordered table-striped table-hover">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${teachers}">
                <td th:text="${t.name}"></td>
                <td th:text="${t.email}"></td>
                <td th:text="${t.department.name}"></td>
                <td>
                    <a th:href="@{/admin/edit-teacher/{id}(id=${t.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/admin/delete-teacher/{id}(id=${t.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Delete teacher?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/admin/add-teacher}" class="btn btn-primary mt-3">Add New Teacher</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

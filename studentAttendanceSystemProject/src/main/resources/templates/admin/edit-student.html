<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="form-container">

    <h2 class="text-center mb-4">Edit Student</h2>

    <form th:action="@{/admin/update-student}" method="post">

        <input type="hidden" name="id" th:value="${student.id}">

        <input type="text" name="rollNumber" th:value="${student.rollNumber}" placeholder="Roll Number" required class="form-control">
        <input type="text" name="name" th:value="${student.name}" placeholder="Name" required class="form-control">
        <input type="email" name="email" th:value="${student.email}" placeholder="Email" required class="form-control">

        <!-- Department -->
        <select name="departmentId" class="form-control" required>
            <option value="">-- Select Department --</option>
            <option th:each="d : ${departments}"
                    th:value="${d.id}"
                    th:text="${d.name}"
                    th:selected="${student.department != null and d.id == student.department.id}">
            </option>
        </select>

        <div class="mb-2">
            <label class="form-label small fw-semibold">Year</label>
            <input type="text" name="year" th:value="${student.year}" placeholder="Year" required class="form-control">
        </div>
        <div class="row mb-2">
            <div class="col-6">
                <label class="form-label small fw-semibold">Section</label>
                <input type="text" name="section" th:value="${student.section}" placeholder="Section" required class="form-control">
            </div>
            <div class="col-6">
                <label class="form-label small fw-semibold">Division (तुकडी)</label>
                <input type="text" name="division" th:value="${student.division}" placeholder="Division (e.g. A, B)" class="form-control">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-6">
                <label class="form-label small fw-semibold">Student Mobile</label>
                <input type="tel" name="mobileNumber" th:value="${student.mobileNumber}" placeholder="Student Mobile" pattern="[0-9]{10}" class="form-control">
            </div>
            <div class="col-6">
                <label class="form-label small fw-semibold">Parent Mobile (Marathi SMS)</label>
                <input type="tel" name="parentMobileNumber" th:value="${student.parentMobileNumber}" placeholder="Parent Mobile" pattern="[0-9]{10}" class="form-control">
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100">Update Student</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

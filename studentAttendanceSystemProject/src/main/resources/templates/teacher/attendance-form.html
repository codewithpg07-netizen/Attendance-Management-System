<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance Form</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Include Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container container-attendance">

    <h2>Attendance for: <span th:text="${subject.subjectName}"></span>
        (<span th:text="${subject.year}"></span> Year)
    </h2>

    <form th:action="@{/teacher/attendance/save}" method="post">
        <input type="hidden" name="subjectId" th:value="${subject.id}">

        <table class="table table-bordered mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Present</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.rollNumber}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.year}"></td>
                    <td>
                        <!-- always send student ID -->
        <input type="hidden" name="studentIds" th:value="${student.id}">
        <!-- checkbox for present -->
        <input type="checkbox" name="presentList" th:value="${student.id}"
               th:checked="${attendanceMap[student.id]}">
                    </td>
                </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary mt-3">Save Attendance</button>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

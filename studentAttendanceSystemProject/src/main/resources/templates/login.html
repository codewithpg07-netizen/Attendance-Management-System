<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Student Attendance System</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>


<!-- Include Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="login-container">
    <div class="login-card">
        <h2>Login</h2>

        <div th:if="${param.error}" class="alert alert-danger py-2 small text-center" role="alert">
            Invalid email or password! Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small text-center" role="alert">
            You have been logged out successfully.
        </div>
        <div th:if="${success}" class="alert alert-success py-2 small text-center" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <input type="email" name="username" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
            <a th:href="@{/register}">Register as Student</a>
            <a th:href="@{/}">Back to Home</a>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

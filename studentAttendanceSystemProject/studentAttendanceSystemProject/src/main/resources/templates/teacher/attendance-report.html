<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance Report</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Include Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container container-report">

    <h2>Attendance Report - <span th:text="${teacher.name}">Teacher Name</span></h2>

    <!-- Filter Form -->
    <form th:action="@{/teacher/attendance/report}" method="get" class="filter-form">
        <select name="subjectId" required>
            <option value="">Select Subject</option>
            <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.subjectName}"></option>
        </select>

        <input type="date" name="date" required />

        <button type="submit">Filter</button>
    </form>

    <!-- Attendance Table -->
    <table class="table">
        <thead>
            <tr>
                <th>Roll Number</th>
                <th>Name</th>
                <th>Department</th>
                <th>Year</th>
                <th>Date</th>
                <th>Subject</th>
                <th>Present</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="att : ${attendances}">
                <td th:text="${att.pstudent.rollNumber}"></td>
                <td th:text="${att.pstudent.name}"></td>
                <td th:text="${att.pstudent.department.name}"></td>
                <td th:text="${att.pstudent.year}"></td>
                <td th:text="${att.date}"></td>
                <td th:text="${att.subject.subjectName}"></td>
                <td th:text="${att.present ? 'Yes' : 'No'}"></td>
            </tr>
        </tbody>
    </table>

    <!-- Back to Dashboard -->
    <a href="/teacher/dashboard" class="btn-back">Back to Dashboard</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

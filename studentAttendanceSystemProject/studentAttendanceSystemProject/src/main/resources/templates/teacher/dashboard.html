<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Include Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container dashboard-container">

    <!-- Welcome Section -->
    <div class="mb-4">
        <h2>Welcome <span th:text="${teacher.name}">Teacher Name</span></h2>
        <p>Email: <span th:text="${teacher.email}"></span></p>
    </div>

    <!-- Subject List with Year -->
    <h4>Subjects</h4>
    <ul class="subject-list">
        <li th:each="s : ${subjects}">
            <span th:text="${s.subjectName + ' (' + s.year + ' Year)'}"></span>
            <a th:href="@{'/teacher/attendance/' + ${s.id}}" class="btn btn-sm btn-primary ms-2">Take Attendance</a>
        </li>
    </ul>

    <!-- Attendance % Table -->
    <h4>Attendance Summary</h4>
    <table class="table table-bordered table-striped mt-2">
        <thead class="table-dark">
            <tr>
                <th>Student Name</th>
                <th>Roll Number</th>
                <th>Department</th>
                <th>Year</th>
                <th>Subject</th>
                <th>Attendance %</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="att : ${studentAttendanceList}"
                th:class="${att.attendancePercent < 75} ? 'table-danger' : ''">
                <td th:text="${att.student.name}"></td>
                <td th:text="${att.student.rollNumber}"></td>
                <td th:text="${att.student.department.name}"></td>
                <td th:text="${att.student.year}"></td>
                <td th:text="${att.subject.subjectName + ' (' + att.subject.year + ' Year)'}"></td>
                <td th:text="${att.attendancePercent} + '%'"></td>
            </tr>
        </tbody>
    </table>

    <!-- Attendance Report Button -->
    <a th:href="@{/teacher/attendance/report}" class="btn btn-success mt-3">View Attendance Report</a>

    <!-- Logout -->
    <div class="mt-4">
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

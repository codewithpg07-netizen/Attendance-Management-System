<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2 th:text="'Attendance for: ' + ${subject.subjectName + ' (' + subject.year + ' Year)'}"></h2>
<p>Student: <span th:text="${student.name}"></span></p>
<p>Department: <span th:text="${student.department.name}"></span> | Year: <span th:text="${student.year}"></span></p>

<table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="att : ${attendanceList}">
            <td th:text="${att.date}"></td>
            <td th:text="${att.present} ? 'Present' : 'Absent'"></td>
        </tr>
    </tbody>
</table>

<!-- Download Buttons -->
<a th:href="@{/student/attendance/download/excel/{subjectId}(subjectId=${subject.id})}" 
   class="btn btn-success mt-3">Download Excel</a>

<a th:href="@{/student/attendance/download/pdf/{subjectId}(subjectId=${subject.id})}" 
   class="btn btn-primary mt-3 ms-2">Download PDF</a>

<a href="/student/dashboard" class="btn btn-secondary mt-3 ms-2">Back to Dashboard</a>

</body>
</html>

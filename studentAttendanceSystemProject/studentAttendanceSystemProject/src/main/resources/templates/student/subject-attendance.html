<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daily Attendance Details</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container container-student mt-4">

    <!-- Heading -->
    <h3 th:text="'Attendance Details - ' + ${subject.subjectName}"></h3>
    <p>Student: <span th:text="${student.name}"></span></p>

    <!-- Attendance Table -->
    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="att : ${dailyAttendance}">
                <td th:text="${att.date}"></td>
                <td th:text="${att.present} ? 'Present' : 'Absent'"></td>
            </tr>
        </tbody>
    </table>

    <!-- Back Button -->
    <a th:href="@{/student/dashboard}" class="btn btn-secondary mt-3">Back to Dashboard</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container container-student">

    <!-- Welcome Section -->
    <h2 class="mt-4">Welcome <span th:text="${student.name}">Student Name</span></h2>
    <p>Department: <span th:text="${student.department.name}"></span></p>
    <p>Year: <span th:text="${student.year}"></span> | Section: <span th:text="${student.section}"></span></p>

    <!-- Subjects -->
    <h3 class="mt-4">Your Subjects</h3>
    <ul class="list-group">
        <li class="list-group-item" th:each="s : ${subjects}">
            <a th:href="@{'/student/subject/' + ${s.id} + '/attendance'}"
               th:text="${s.subjectName + ' (' + s.year + ' Year)'}"></a>
        </li>
    </ul>

    <!-- Attendance Summary -->
    <h3 class="mt-4">Attendance Summary</h3>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Subject</th>
                <th>Attendance %</th>
                <th>Status</th>
                <th>Download</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="att : ${attendanceList}" 
                th:class="${att['lowAttendance']} ? 'table-danger' : ''">
                <td th:text="${att['subject'].subjectName + ' (' + att['subject'].year + ' Year)'}"></td>
                <td th:text="${att['attendancePercentFormatted']}"></td>
                <td th:text="${att['lowAttendance']} ? 'Low Attendance' : 'OK'"></td>
                <td>
                    <a th:href="@{'/student/attendance/download/excel/' + ${att['subject'].id}}"
                       class="btn btn-success btn-sm">Excel</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Logout Button -->
    <a href="/logout" class="btn btn-danger mt-3">Logout</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

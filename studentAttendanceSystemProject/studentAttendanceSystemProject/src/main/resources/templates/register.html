<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Registration Form -->
<div class="registration-card">
    <h3>Student Registration</h3>
    <form th:action="@{/register}" method="post">
        <input type="text" name="name" placeholder="Full Name" required class="form-control mb-3">
        <input type="email" name="email" placeholder="Email" required class="form-control mb-3">
        <input type="text" name="rollNumber" placeholder="Roll Number" required class="form-control mb-3">
        <input type="password" name="password" placeholder="Password" required class="form-control mb-3">
        <input type="hidden" name="role" value="STUDENT">
        <button type="submit" class="btn btn-primary w-100 mb-2">Register</button>
    </form>
    <p th:if="${error}" class="text-danger mt-2 text-center" th:text="${error}"></p>
    <p th:if="${success}" class="text-success mt-2 text-center" th:text="${success}"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

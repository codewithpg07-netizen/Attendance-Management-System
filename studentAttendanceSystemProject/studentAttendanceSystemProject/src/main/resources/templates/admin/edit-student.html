<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="form-container">

    <h2 class="text-center mb-4">Edit Student</h2>

    <form th:action="@{/admin/update-student}" method="post">

        <input type="hidden" name="id" th:value="${student.id}">

        <input type="text" name="rollNumber" th:value="${student.rollNumber}" placeholder="Roll Number" required class="form-control">
        <input type="text" name="name" th:value="${student.name}" placeholder="Name" required class="form-control">
        <input type="email" name="email" th:value="${student.email}" placeholder="Email" required class="form-control">

        <!-- Department -->
        <select name="departmentId" class="form-control" required>
            <option value="">-- Select Department --</option>
            <option th:each="d : ${departments}"
                    th:value="${d.id}"
                    th:text="${d.name}"
                    th:selected="${student.department != null and d.id == student.department.id}">
            </option>
        </select>

        <input type="text" name="year" th:value="${student.year}" placeholder="Year" required class="form-control">
        <input type="text" name="section" th:value="${student.section}" placeholder="Section" required class="form-control">

        <button type="submit" class="btn btn-success">Update Student</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

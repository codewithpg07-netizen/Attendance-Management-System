<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Students - Admin</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container students-card">

    <h2>All Students</h2>

    <!-- Filter Form -->
    <form th:action="@{/admin/view-students}" method="get" class="filter-form">
        <select name="departmentId" class="form-select w-auto">
            <option value="">All Departments</option>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
        </select>

        <select name="year" class="form-select w-auto">
            <option value="">All Years</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
        </select>

        <button type="submit" class="btn btn-primary">Filter</button>
    </form>

    <!-- Students Table -->
    <div class="table-container">
        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>Section</th>
                    <th>Registered</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.rollNumber}"></td>
                    <td th:text="${s.name}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.department.name}"></td>
                    <td th:text="${s.year}"></td>
                    <td th:text="${s.section}"></td>
                    <td th:text="${s.registered} ? 'Yes' : 'No'"></td>
                    <td>
                        <a th:href="@{/admin/edit-student/{id}(id=${s.id})}" class="btn btn-warning btn-sm mb-1">Edit</a>
                        <a th:href="@{/admin/delete-student/{id}(id=${s.id})}" class="btn btn-danger btn-sm mb-1" onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/admin/dashboard}" class="btn btn-success mt-3">Upload More Students</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

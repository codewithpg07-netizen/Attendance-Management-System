<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Teacher</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="form-container">

    <h2 class="text-center mb-4">Edit Teacher</h2>

    <form th:action="@{/admin/update-teacher}" th:object="${teacher}" method="post">

        <!-- ID hidden -->
        <input type="hidden" th:field="*{id}">

        <!-- Name -->
        <input type="text" th:field="*{name}" placeholder="Name" required class="form-control">

        <!-- Email -->
        <input type="email" th:field="*{email}" placeholder="Email" required class="form-control">

        <!-- Department -->
        <select th:field="*{department.id}" class="form-control" required>
            <option value="">Select Department</option>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
        </select>

        <!-- Subject -->
        <select th:field="*{subject.id}" class="form-control" required>
            <option value="">Select Subject</option>
            <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.subjectName}"></option>
        </select>

        <button type="submit" class="btn btn-success">Update Teacher</button>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Teacher</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="form-container">

    <h2 class="text-center mb-4">Add Teacher</h2>

    <!-- Success Message -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Form -->
    <form th:action="@{/admin/add-teachers}" th:object="${teacher}" method="post">
        <input type="text" th:field="*{name}" placeholder="Name" required class="form-control mb-3">
        <input type="email" th:field="*{email}" placeholder="Email" required class="form-control mb-3">
        <input type="password" th:field="*{password}" placeholder="Password" required class="form-control mb-3">

        <!-- Department Dropdown -->
        <select th:field="*{department.id}" class="form-control mb-3" required>
            <option value="">Select Department</option>
            <option th:each="d : ${departments}"
                    th:value="${d.id}"
                    th:text="${d.name}">
            </option>
        </select>

        <button type="submit" class="btn btn-primary w-100">Add Teacher</button>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

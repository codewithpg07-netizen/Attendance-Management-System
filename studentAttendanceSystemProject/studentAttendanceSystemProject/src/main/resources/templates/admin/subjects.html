<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Subjects</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-5">

    <h2 class="mb-4 text-center">Subject Management</h2>

    <!-- Subjects Table -->
    <div class="card mb-4">
        <div class="card-body">
            <h4>All Subjects</h4>
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Subject Name</th>
                        <th>Code</th>
                        <th>Department</th>
                        <th>Teacher</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${subjects}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.subjectName}"></td>
                        <td th:text="${s.code}"></td>
                        <td th:text="${s.department.name}"></td>
                        <td th:text="${s.teacher != null ? s.teacher.name : '-'}"></td>
                        <td>
                            <a th:href="@{/admin/subjects/edit/{id}(id=${s.id})}" class="btn btn-warning btn-sm">Edit</a>
                            <a th:href="@{/admin/subjects/delete/{id}(id=${s.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Subject Form -->
    <div class="card p-4">
        <h4 class="mb-3">Add / Update Subject</h4>
        <form th:action="@{/admin/subjects/update}" th:object="${subject}" method="post">
            <input type="hidden" th:field="*{id}" />

            <input type="text" th:field="*{subjectName}" placeholder="Subject Name" required class="form-control">
            <input type="text" th:field="*{code}" placeholder="Subject Code" required class="form-control">

            <!-- Department Dropdown -->
            <select th:field="*{department.id}" class="form-control" id="departmentSelect" required>
                <option value="">--Select Department--</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" 
                        th:selected="${d.id} == ${subject.department.id}"></option>
            </select>

            <!-- Teacher Dropdown -->
            <select th:field="*{teacher.id}" class="form-control" id="teacherSelect">
                <option value="">Select Teacher</option>
            </select>

            <!-- Year Dropdown -->
            <select th:field="*{year}" class="form-control" required>
                <option value="">Select Year</option>
                <option value="1" th:selected="${subject.year == '1'}">1st Year</option>
                <option value="2" th:selected="${subject.year == '2'}">2nd Year</option>
                <option value="3" th:selected="${subject.year == '3'}">3rd Year</option>
                <option value="4" th:selected="${subject.year == '4'}">4th Year</option>
            </select>

            <button type="submit" class="btn btn-primary mt-3">Add / Update Subject</button>
        </form>
    </div>

</div>

<script>
document.getElementById('departmentSelect').addEventListener('change', function() {
    let deptId = this.value;
    let teacherSelect = document.getElementById('teacherSelect');
    teacherSelect.innerHTML = '<option value="">Select Teacher</option>';

    if(deptId) {
        fetch('/admin/subjects/teachers-by-department/' + deptId)
            .then(response => response.json())
            .then(data => {
                data.forEach(teacher => {
                    let option = document.createElement('option');
                    option.value = teacher.id;
                    option.text = teacher.name;
                    teacherSelect.appendChild(option);
                });
            });
    }
});
</script>

</body>
</html>
